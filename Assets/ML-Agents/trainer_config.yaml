behaviors:
  PlayerAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 16384
      buffer_size: 163840
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 10000000
    time_horizon: 2048
    summary_freq: 10000
    keep_checkpoints: 10
    checkpoint_interval: 100000
    threaded: true
